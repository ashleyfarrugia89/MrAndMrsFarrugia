<section>
  <div class="section-inner">

  <main>
    <p class="page-eyebrow">Your memories</p>
    <h1 class="page-title">Gallery</h1>
    <div class="page-divider"></div>
    <p class="page-intro">Share your photos from the day! Upload a picture and add a caption to go with it.</p>
   
    <div class="upload-row">
      <label class="gallery-upload-btn" for="gallery-file-input">📷 &nbsp;Share a photo</label>
      <input
        type="file"
        id="gallery-file-input"
        accept="image/jpeg,image/png,image/webp,image/gif"
        multiple
        style="display:none;"
        onchange="openCaptionModal(this)"
      />
      <span class="upload-status" id="upload-status"></span>
    </div>
   
    <div class="gallery-grid" id="gallery-grid">
      <p class="gallery-placeholder">Loading photos…</p>
    </div>
  </main>
   
<!-- Caption modal -->
<div id="caption-modal">
  <div class="caption-modal-box">
    <img id="caption-preview" class="caption-modal-preview" src="" alt="Preview" />
    <label class="caption-modal-label" for="author-input">Your name</label>
    <input
      type="text"
      id="author-input"
      class="caption-modal-input"
      maxlength="60"
      placeholder="e.g. Sarah"
      autocomplete="name"
    />
    <label class="caption-modal-label" for="caption-input" style="margin-top:14px;">Add a caption</label>
    <textarea
      id="caption-input"
      class="caption-modal-input"
      rows="3"
      maxlength="500"
      placeholder="e.g. Holly looking absolutely gorgeous 💕"
      oninput="updateCaptionCount(this)"
    ></textarea>
    <p class="caption-modal-hint">Caption optional — leave blank to skip. <span id="caption-count" style="float:right;opacity:0.5;">500</span></p>
    <div class="caption-modal-actions">
      <button class="caption-btn-cancel" onclick="cancelUpload()">Cancel</button>
      <button class="caption-btn-upload" id="caption-upload-btn" onclick="submitUpload()">Upload</button>
    </div>
  </div>
</div>
 
<!-- Lightbox -->
<div id="gallery-lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <button class="lightbox-prev" onclick="event.stopPropagation(); shiftLightbox(-1)">&#8249;</button>
  <button class="lightbox-next" onclick="event.stopPropagation(); shiftLightbox(1)">&#8250;</button>
  <img id="lightbox-img" src="" alt="Wedding photo" onclick="event.stopPropagation()" />
  <p id="lightbox-caption" onclick="event.stopPropagation()"></p>
</div>
 
<script>
  const S3_BASE     = 'https://s3.eu-north-1.amazonaws.com/farrugia.wedding.gallery';
  const PRESIGN_API = 'https://7vy30zvgz9.execute-api.eu-north-1.amazonaws.com/wedding/presign';
 
  // allPhotos: [{key, caption, author}] sorted newest-first
  let allPhotos = [];
  let displayCount = 6;
  let lightboxIndex = 0;
 
  // Pending files from the file picker (waiting for caption modal)
  let pendingFiles = [];
  let pendingIndex = 0;
 
  // Author name — persisted in localStorage, asked once per bulk upload
  // On first upload of a session the user sets it; subsequent photos in the
  // same batch re-use it without asking again.
  let sessionAuthor = localStorage.getItem('weddingGalleryAuthor') || '';
 
  function getOrGenerateGuest() {
    // If still no name after the modal, assign a stable Guest number for this session
    if (!sessionGuestTag) sessionGuestTag = 'Guest ' + Math.floor(1000 + Math.random() * 9000);
    return sessionGuestTag;
  }
  let sessionGuestTag = '';
 
  // ── DATA LOADING ──
 
  async function fetchPhotos() {
    const res  = await fetch(`${S3_BASE}/?list-type=2&prefix=uploads/&_=${Date.now()}`);
    const text = await res.text();
    const xml  = new DOMParser().parseFromString(text, 'text/xml');
 
    const all = [...xml.getElementsByTagName('Contents')].map(el => ({
      key:          el.getElementsByTagName('Key')[0].textContent,
      lastModified: el.getElementsByTagName('LastModified')[0].textContent,
    }));
 
    const imageItems = all
      .filter(o => /\.(jpg|jpeg|png|webp|gif)$/i.test(o.key))
      .sort((a, b) => new Date(b.lastModified) - new Date(a.lastModified));
 
    // Build a set of JSON sidecar keys for quick lookup
    const jsonKeys = new Set(all.filter(o => o.key.endsWith('.json')).map(o => o.key));
 
    // Fetch captions in parallel for photos that have sidecars
    return Promise.all(imageItems.map(async item => {
      const base = item.key.replace(/\.[^.]+$/, '');
      const jsonKey = `${base}.json`;
      if (jsonKeys.has(jsonKey)) {
        try {
          const r = await fetch(`${S3_BASE}/${jsonKey}?_=${Date.now()}`);
          const data = await r.json();
          return {
            key: item.key,
            caption: (data.caption || '').trim(),
            author:  (data.author  || '').trim(),
          };
        } catch { /* no sidecar */ }
      }
      return { key: item.key, caption: '', author: '' };
    }));
  }
 
  async function loadGallery() {
    const grid = document.getElementById('gallery-grid');
    try {
      allPhotos = await fetchPhotos();
      displayCount = 6;
      renderGrid();
    } catch (err) {
      grid.innerHTML = '<p class="gallery-placeholder">Could not load photos. Please refresh to try again.</p>';
      console.warn('Gallery load error:', err);
    }
  }
 
  async function silentRefresh() {
    try {
      const fresh = await fetchPhotos();
      if (fresh.length && (!allPhotos.length || fresh[0].key !== allPhotos[0].key)) {
        allPhotos = fresh;
        renderGrid();
      } else {
        allPhotos = fresh;
      }
    } catch (_) {}
  }
 
  // ── RENDERING ──
 
  function renderGrid() {
    const grid = document.getElementById('gallery-grid');
    const visible = allPhotos.slice(0, displayCount);
 
    if (visible.length === 0) {
      grid.innerHTML = '<p class="gallery-placeholder">No photos yet — be the first to share one!</p>';
      return;
    }
 
    const items = visible.map((photo, i) => {
      const hasCaption = !!photo.caption;
      const hasAuthor  = !!photo.author;
      const metaHtml = (hasCaption || hasAuthor)
        ? `<div class="gallery-item-caption">
             <p class="caption-line">${
               hasAuthor ? `<strong class="caption-author">${escHtml(photo.author)}</strong> ` : ''
             }${
               hasCaption ? escHtml(photo.caption) : ''
             }</p>
           </div>`
        : '';
      return `<div class="gallery-item" onclick="openLightbox(${i})">
        <div class="gallery-item-img">
          <img src="${S3_BASE}/${photo.key}" loading="lazy" alt="Wedding photo" />
        </div>
        ${metaHtml}
      </div>`;
    }).join('');
 
    const seeMore = allPhotos.length > displayCount
      ? `<div class="see-more-row">
           <button class="see-more-btn" onclick="showMore()">See more photos</button>
         </div>`
      : '';
 
    grid.innerHTML = items + seeMore;
    requestAnimationFrame(addCaptionToggles);
  }
 
  function addCaptionToggles() {
    document.querySelectorAll('.caption-line').forEach(el => {
      if (el.scrollHeight > el.clientHeight + 1) {
        const btn = document.createElement('button');
        btn.className = 'caption-more-btn';
        btn.textContent = 'more';
        btn.onclick = function(e) {
          e.stopPropagation();
          el.style.webkitLineClamp = 'unset';
          el.style.overflow = 'visible';
          el.style.display = 'block';
          btn.remove();
        };
        el.parentNode.appendChild(btn);
      }
    });
  }
 
  function showMore() {
    displayCount += 6;
    renderGrid();
  }
 
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
 
  // Count remaining caption characters using Unicode code points (not UTF-16 units),
  // so emoji like 🏰 count as 1 not 2.
  function updateCaptionCount(el) {
    const max = parseInt(el.maxLength, 10);
    const used = [...el.value].length; // spread iterates code points
    const remaining = max - used;
    const counter = document.getElementById('caption-count');
    if (counter) counter.textContent = remaining;
    // Silently trim if pasted text pushes over the code-point limit
    if (used > max) {
      el.value = [...el.value].slice(0, max).join('');
    }
  }
 
  // ── CAPTION MODAL ──
 
  function openCaptionModal(input) {
    pendingFiles = [...input.files];
    pendingIndex = 0;
    input.value = '';
    if (!pendingFiles.length) return;
    showModalForFile(pendingIndex);
  }
 
  function showModalForFile(idx) {
    const file = pendingFiles[idx];
    const preview      = document.getElementById('caption-preview');
    const captionInput = document.getElementById('caption-input');
    const authorInput  = document.getElementById('author-input');
 
    // Show image preview
    const url = URL.createObjectURL(file);
    preview.onload = () => URL.revokeObjectURL(url);
    preview.src = url;
 
    // Pre-fill author from memory / localStorage; user can still change it
    authorInput.value = sessionAuthor;
 
    captionInput.value = '';
    updateCaptionCount(captionInput);
    document.getElementById('upload-status').textContent =
      pendingFiles.length > 1 ? `Photo ${idx + 1} of ${pendingFiles.length}` : '';
    document.getElementById('caption-upload-btn').disabled = false;
    document.getElementById('caption-upload-btn').textContent =
      pendingFiles.length > 1 && idx < pendingFiles.length - 1 ? 'Next →' : 'Upload';
 
    document.getElementById('caption-modal').classList.add('open');
    // Focus name field on first photo, caption field on subsequent
    (idx === 0 && !sessionAuthor ? authorInput : captionInput).focus();
  }
 
  function cancelUpload() {
    pendingFiles = [];
    pendingIndex = 0;
    document.getElementById('caption-modal').classList.remove('open');
    document.getElementById('upload-status').textContent = '';
  }
 
  async function submitUpload() {
    const file    = pendingFiles[pendingIndex];
    const caption = document.getElementById('caption-input').value.trim();
 
    // Save author for this batch and persist across page loads
    const typedAuthor = document.getElementById('author-input').value.trim();
    const author = typedAuthor || getOrGenerateGuest();
    sessionAuthor = typedAuthor; // remember what they typed (blank = keep asking)
    if (typedAuthor) localStorage.setItem('weddingGalleryAuthor', typedAuthor);
    const btn     = document.getElementById('caption-upload-btn');
    const status  = document.getElementById('upload-status');
 
    btn.disabled = true;
    btn.textContent = 'Uploading…';
 
    const ext  = file.name.split('.').pop().toLowerCase() || 'jpg';
    const mime = { jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', webp:'image/webp', gif:'image/gif' }[ext] || file.type || 'image/jpeg';
 
    // HEIC guard (shouldn't reach here but just in case)
    if (ext === 'heic' || ext === 'heif') {
      status.textContent = 'HEIC not supported — please save as JPEG first.';
      document.getElementById('caption-modal').classList.remove('open');
      return;
    }
 
    try {
      const presignRes = await fetch(`${PRESIGN_API}?ext=${ext}`);
      if (!presignRes.ok) throw new Error(`Presign failed: ${presignRes.status}`);
      const { url, captionUrl } = await presignRes.json();
 
      // Upload image
      const s3Res = await fetch(url, { method: 'PUT', body: file, headers: { 'Content-Type': mime } });
      if (!s3Res.ok) throw new Error(`S3 upload failed: ${s3Res.status}`);
 
      // Always upload sidecar — author is always set, caption is optional
      if (captionUrl) {
        await fetch(captionUrl, {
          method: 'PUT',
          body: JSON.stringify({ author, ...(caption ? { caption } : {}) }),
          headers: { 'Content-Type': 'application/json' },
        });
      }
    } catch (err) {
      console.error('Upload error:', err);
      status.textContent = `Could not upload ${file.name} — please try again.`;
      document.getElementById('caption-modal').classList.remove('open');
      btn.disabled = false;
      return;
    }
 
    document.getElementById('caption-modal').classList.remove('open');
    pendingIndex++;
 
    if (pendingIndex < pendingFiles.length) {
      // More files to process
      setTimeout(() => showModalForFile(pendingIndex), 200);
    } else {
      // All done
      pendingFiles = [];
      pendingIndex = 0;
      status.textContent = pendingFiles.length === 1 ? 'Photo shared! 🎉' : 'Photos shared! 🎉';
      status.textContent = 'Photos shared! 🎉';
      setTimeout(() => { status.textContent = ''; loadGallery(); }, 2000);
    }
  }
 
  // ── LIGHTBOX ──
 
  function openLightbox(index) {
    lightboxIndex = index;
    const photo = allPhotos[index];
    document.getElementById('lightbox-img').src = `${S3_BASE}/${photo.key}`;
    document.getElementById('lightbox-caption').innerHTML =
      (photo.author  ? `<strong class="lightbox-author">${escHtml(photo.author)}</strong> ` : '') +
      (photo.caption ? escHtml(photo.caption) : '');
    document.getElementById('gallery-lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
 
  function closeLightbox() {
    document.getElementById('gallery-lightbox').classList.remove('open');
    document.getElementById('lightbox-img').src = '';
    document.getElementById('lightbox-caption').textContent = '';
    document.body.style.overflow = '';
  }
 
  function shiftLightbox(dir) {
    lightboxIndex = (lightboxIndex + dir + allPhotos.length) % allPhotos.length;
    const photo = allPhotos[lightboxIndex];
    document.getElementById('lightbox-img').src = `${S3_BASE}/${photo.key}`;
    document.getElementById('lightbox-caption').innerHTML =
      (photo.author  ? `<strong class="lightbox-author">${escHtml(photo.author)}</strong> ` : '') +
      (photo.caption ? escHtml(photo.caption) : '');
  }
 
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowRight') shiftLightbox(1);
    if (e.key === 'ArrowLeft')  shiftLightbox(-1);
  });
 
  // Close modal on backdrop click
  const _captionModal = document.getElementById('caption-modal');
  if (_captionModal) {
    _captionModal.addEventListener('click', function(e) {
      if (e.target === this) cancelUpload();
    });
  }
 
  loadGallery();
  setInterval(silentRefresh, 10000);
</script>
