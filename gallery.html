<script>
  const S3_BASE     = 'https://s3.eu-north-1.amazonaws.com/farrugia.wedding.gallery';
  const PRESIGN_API = 'https://7vy30zvgz9.execute-api.eu-north-1.amazonaws.com/wedding/presign';
  const REACT_API   = 'https://7vy30zvgz9.execute-api.eu-north-1.amazonaws.com/wedding/react';
 
  // ── SVG ICONS ──

      <path fill="none" stroke="#2c2c2c" stroke-width="2" stroke-linecap="round" d="M12 23s2 3.5 6 3.5 6-3.5 6-3.5"/>
    </svg>`,
    '😂': `<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
      <circle class="rx-fill" cx="18" cy="18" r="15" fill="#fff" stroke="#2c2c2c" stroke-width="2"/>
      <path fill="none" stroke="#2c2c2c" stroke-width="2" stroke-linecap="round" d="M11 13q2-3 5 0M20 13q2-3 5 0"/>
      <path fill="#2c2c2c" d="M11 20q3 8 7 7 4 1 7-7z"/>
      <path fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-linecap="round" d="M8 17q-1 3 1 4"/>
    </svg>`,
    '🥂': `<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
      <!-- Left flute -->
      <path class="rx-fill" fill="#fff" stroke="#2c2c2c" stroke-width="2" stroke-linejoin="round"
            d="M5 4 L14 4 Q13 10 11 18 L8 18 Q6 10 5 4 Z"/>
      <line x1="9.5" y1="18" x2="9.5" y2="29" stroke="#2c2c2c" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="29" x2="13" y2="29" stroke="#2c2c2c" stroke-width="2" stroke-linecap="round"/>
      <circle cx="9" cy="15" r="1.1" fill="#2c2c2c"/>
      <circle cx="9.5" cy="11" r="1.1" fill="#2c2c2c"/>
      <circle cx="9" cy="7.5" r="1.1" fill="#2c2c2c"/>
      <!-- Right flute -->
      <path class="rx-fill" fill="#fff" stroke="#2c2c2c" stroke-width="2" stroke-linejoin="round"
            d="M22 4 L31 4 Q30 10 28 18 L25 18 Q23 10 22 4 Z"/>
      <line x1="26.5" y1="18" x2="26.5" y2="29" stroke="#2c2c2c" stroke-width="2" stroke-linecap="round"/>
      <line x1="23" y1="29" x2="30" y2="29" stroke="#2c2c2c" stroke-width="2" stroke-linecap="round"/>
      <circle cx="27" cy="15" r="1.1" fill="#2c2c2c"/>
      <circle cx="26.5" cy="11" r="1.1" fill="#2c2c2c"/>
      <circle cx="27" cy="7.5" r="1.1" fill="#2c2c2c"/>

      <line x1="18" y1="1" x2="18" y2="5" stroke="#2c2c2c" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="15" y1="3" x2="21" y2="3" stroke="#2c2c2c" stroke-width="1.8" stroke-linecap="round"/>
    </svg>`,
    '😮': `<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
      <circle class="rx-fill" cx="18" cy="18" r="15" fill="#fff" stroke="#2c2c2c" stroke-width="2"/>
      <path fill="none" stroke="#2c2c2c" stroke-width="2" stroke-linecap="round" d="M11 12q2-2 4 0M21 12q2-2 4 0"/>
      <ellipse cx="13" cy="15.5" rx="2" ry="2.5" fill="#2c2c2c"/>
      <ellipse cx="23" cy="15.5" rx="2" ry="2.5" fill="#2c2c2c"/>
      <ellipse cx="18" cy="24" rx="3.5" ry="4" fill="none" stroke="#2c2c2c" stroke-width="2"/>
    </svg>`,
  };
 
  const REACTIONS = [
    { emoji: '❤️',  label: 'Love'       },
    { emoji: '😍',  label: 'Heart eyes' },
    { emoji: '😂',  label: 'Haha'       },
    { emoji: '🥂',  label: 'Cheers'     },
    { emoji: '😮',  label: 'Wow'        },
  ];
 
  // ── STATE ──
  let allPhotos      = [];
  let displayCount   = 6;
  let lightboxIndex  = 0;
  let pendingFiles   = [];
  let pendingIndex   = 0;
  let sessionAuthor  = localStorage.getItem('weddingGalleryAuthor') || '';
  let sessionGuestTag   = '';
  let uploadInProgress  = false;
  let pendingPhotos     = null;
  const reactingLocks   = new Set();
  const myUploadedKeys  = new Set();
 
  function getOrGenerateGuest() {
    if (!sessionGuestTag) sessionGuestTag = 'Guest ' + Math.floor(1000 + Math.random() * 9000);
    return sessionGuestTag;
  }
 
  // ── REACTIONS ──
 
  function getMyReactions() {
    try { return JSON.parse(localStorage.getItem('weddingMyReactions') || '{}'); } catch { return {}; }
  }
 
  function saveMyReaction(key, emoji) {
    const mine = getMyReactions();
    mine[key] = mine[key] || [];
    if (!mine[key].includes(emoji)) mine[key].push(emoji);
    localStorage.setItem('weddingMyReactions', JSON.stringify(mine));
  }
 
  function removeMyReaction(key, emoji) {
    const mine = getMyReactions();
    if (mine[key]) {
      mine[key] = mine[key].filter(e => e !== emoji);
      if (!mine[key].length) delete mine[key];
    }
    localStorage.setItem('weddingMyReactions', JSON.stringify(mine));
  }
 
  function hasReacted(key, emoji) {
    return (getMyReactions()[key] || []).includes(emoji);
  }
 
  function reactionBarHtml(key, reactions, large) {
    const safeKey = escHtml(key);
    return REACTIONS.map(({ emoji, label }) => {
      const count   = (reactions || {})[emoji] || 0;
      const reacted = hasReacted(key, emoji);
      return `<button class="reaction-btn${reacted ? ' reacted' : ''}${large ? ' reaction-btn-lg' : ''}"
                data-key="${safeKey}" data-emoji="${emoji}"
                onclick="reactToPhoto(this.dataset.key, this.dataset.emoji, event)"
                title="${label}"
              ><span class="reaction-img">${REACTION_SVGS[emoji]}</span>${count ? `<span class="reaction-count">${count}</span>` : ''}</button>`;
    }).join('');
  }
 
  function updateReactionBar(key, reactions) {
    // Update each button in-place to avoid destroying hover/focus state
    document.querySelectorAll(`.reaction-bar[data-key="${CSS.escape(key)}"] .reaction-btn`).forEach(btn => {
      const emoji   = btn.dataset.emoji;
      const count   = (reactions || {})[emoji] || 0;
      const reacted = hasReacted(key, emoji);
      btn.classList.toggle('reacted', reacted);
      let countEl = btn.querySelector('.reaction-count');
      if (count) {
        if (!countEl) {
          countEl = document.createElement('span');
          countEl.className = 'reaction-count';
          btn.appendChild(countEl);
        }
        countEl.textContent = count;
      } else if (countEl) {
        countEl.remove();
      }
    });
    // Update lightbox if it's showing this photo
    if (allPhotos[lightboxIndex] && allPhotos[lightboxIndex].key === key) {
      renderLightboxReactions(reactions, key);
    }
  }
 
  function renderLightboxReactions(reactions, key) {
    const el = document.getElementById('lightbox-reactions');
    if (!el) return;
    const existing = el.querySelectorAll('.reaction-btn');
    if (existing.length && el.dataset.key === key) {
      // In-place update — no flicker
      existing.forEach(btn => {
        const emoji   = btn.dataset.emoji;
        const count   = (reactions || {})[emoji] || 0;
        const reacted = hasReacted(key, emoji);
        btn.classList.toggle('reacted', reacted);
        let countEl = btn.querySelector('.reaction-count');
        if (count) {
          if (!countEl) { countEl = document.createElement('span'); countEl.className = 'reaction-count'; btn.appendChild(countEl); }
          countEl.textContent = count;
        } else if (countEl) { countEl.remove(); }
      });
    } else {
      el.dataset.key = key;
      el.innerHTML = reactionBarHtml(key, reactions, true);
    }
  }
 
  async function reactToPhoto(key, emoji, event) {
    event.stopPropagation();
 
    const lockKey = `${key}::${emoji}`;
    if (reactingLocks.has(lockKey)) return;
    reactingLocks.add(lockKey);
 
    try {
      const photo = allPhotos.find(p => p.key === key);
      if (!photo) return;
 
      const alreadyReacted = hasReacted(key, emoji);
      const action = alreadyReacted ? 'remove' : 'add';
 
      // Optimistic update
      photo.reactions = photo.reactions || {};
      if (alreadyReacted) {
        photo.reactions[emoji] = Math.max(0, (photo.reactions[emoji] || 1) - 1);
        removeMyReaction(key, emoji);
      } else {
        photo.reactions[emoji] = (photo.reactions[emoji] || 0) + 1;
        saveMyReaction(key, emoji);
      }
      updateReactionBar(key, photo.reactions);
 
      // Persist to backend
      try {
        const res = await fetch(
          `${REACT_API}?key=${encodeURIComponent(key)}&emoji=${encodeURIComponent(emoji)}&action=${action}`,
          { method: 'POST' }
        );
        if (res.ok) {
          const updated = await res.json();
          photo.reactions = updated;
          updateReactionBar(key, updated);
        }
      } catch (err) {
        console.warn('React failed — keeping optimistic update:', err);
      }
    } finally {
      reactingLocks.delete(lockKey);
    }
  }
 
  // ── DATA LOADING ──
 
  async function fetchPhotos() {
    const res  = await fetch(`${S3_BASE}/?list-type=2&prefix=uploads/&_=${Date.now()}`);
    const text = await res.text();
    const xml  = new DOMParser().parseFromString(text, 'text/xml');
 
    const all = [...xml.getElementsByTagName('Contents')].map(el => ({
      key:          el.getElementsByTagName('Key')[0].textContent,
      lastModified: el.getElementsByTagName('LastModified')[0].textContent,
    }));
 
    const imageItems = all
      .filter(o => /\.(jpg|jpeg|png|webp|gif)$/i.test(o.key))
      .sort((a, b) => new Date(b.lastModified) - new Date(a.lastModified));
 
    // All JSON keys (captions + reactions)
    const jsonKeys = new Set(all.filter(o => o.key.endsWith('.json')).map(o => o.key));
 
    return Promise.all(imageItems.map(async item => {
      const base         = item.key.replace(/\.[^.]+$/, '');
      const jsonKey      = `${base}.json`;
      const reactionsKey = `${base}.reactions.json`;
 
      const [captionData, reactionsData] = await Promise.all([
        jsonKeys.has(jsonKey)
          ? fetch(`${S3_BASE}/${jsonKey}?_=${Date.now()}`).then(r => r.json()).catch(() => ({}))
          : Promise.resolve({}),
        jsonKeys.has(reactionsKey)
          ? fetch(`${S3_BASE}/${reactionsKey}?_=${Date.now()}`).then(r => r.json()).catch(() => ({}))
          : Promise.resolve({}),
      ]);
 
      return {
        key:       item.key,
        caption:   (captionData.caption || '').trim(),
        author:    (captionData.author  || '').trim(),
        reactions: reactionsData || {},
      };
    }));
  }
 
  async function loadGallery() {
    const grid = document.getElementById('gallery-grid');
    try {
      allPhotos = await fetchPhotos();
      displayCount = 6;
      renderGrid();
    } catch (err) {
      grid.innerHTML = '<p class="gallery-placeholder">Could not load photos. Please refresh to try again.</p>';
      console.warn('Gallery load error:', err);
    }
  }
 
  function showNewPhotosBanner(count) {
    const banner = document.getElementById('new-photos-banner');
    const label  = document.getElementById('new-photos-label');
    if (!banner) return;
    label.textContent = `${count} new photo${count === 1 ? '' : 's'} added — tap to see`;
    banner.style.display = 'flex';
  }
 
  function hideNewPhotosBanner() {
    const banner = document.getElementById('new-photos-banner');
    if (banner) banner.style.display = 'none';
  }
 
  function applyPendingPhotos() {
    if (!pendingPhotos) return;
    allPhotos = pendingPhotos;
    pendingPhotos = null;
    displayCount = 6;
    hideNewPhotosBanner();
    renderGrid();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
 
  async function silentRefresh() {
    if (uploadInProgress || pendingFiles.length) return;
    try {
      const fresh = await fetchPhotos();
 
      // Always update reaction counts in-place
      fresh.forEach(freshPhoto => {
        const existing = allPhotos.find(p => p.key === freshPhoto.key);
        if (existing && JSON.stringify(existing.reactions) !== JSON.stringify(freshPhoto.reactions)) {
          existing.reactions = freshPhoto.reactions;
          updateReactionBar(freshPhoto.key, freshPhoto.reactions);
        }
      });
 
      // New photos detected (excluding ones this device just uploaded) — show banner
      const genuinelyNew = fresh.filter(p =>
        !allPhotos.find(e => e.key === p.key) && !myUploadedKeys.has(p.key)
      );
      const hadRemovals = allPhotos.some(p => !fresh.find(f => f.key === p.key));
 
      if (genuinelyNew.length > 0) {
        pendingPhotos = fresh;
        showNewPhotosBanner(genuinelyNew.length);
      } else {
        allPhotos = fresh;
        if (hadRemovals) renderGrid();
      }
    } catch (_) {}
  }
 
  // ── RENDERING ──
 
  function cardHtml(photo, index) {
    const hasCaption = !!photo.caption;
    const hasAuthor  = !!photo.author;
    const metaHtml = (hasCaption || hasAuthor)
      ? `<div class="gallery-item-caption"><p class="caption-line">${
          hasAuthor ? `<strong class="caption-author">${escHtml(photo.author)}</strong> ` : ''
        }${hasCaption ? escHtml(photo.caption) : ''}</p></div>`
      : '';
    return `<div class="gallery-item" onclick="openLightbox(${index})">
      <div class="gallery-item-img"><img src="${S3_BASE}/${photo.key}" loading="lazy" alt="Wedding photo" /></div>
      <div class="reaction-bar" data-key="${escHtml(photo.key)}">${reactionBarHtml(photo.key, photo.reactions)}</div>
      ${metaHtml}
    </div>`;
  }
 
  function renderGrid() {
    const grid = document.getElementById('gallery-grid');
    const visible = allPhotos.slice(0, displayCount);
 
    if (visible.length === 0) {
      grid.innerHTML = '<p class="gallery-placeholder">No photos yet — be the first to share one!</p>';
      return;
    }
 
    const seeMore = allPhotos.length > displayCount
      ? `<div class="see-more-row"><button class="see-more-btn" onclick="showMore()">See more photos</button></div>`
      : '';
 
    grid.innerHTML = visible.map((photo, i) => cardHtml(photo, i)).join('') + seeMore;
    requestAnimationFrame(() => requestAnimationFrame(addCaptionToggles));
  }
 
  function addCaptionToggles() {
    document.querySelectorAll('.caption-line').forEach(el => {
      if (el.parentNode.querySelector('.caption-more-btn')) return; // already added
      if (el.scrollHeight > el.clientHeight + 1) {
        const btn = document.createElement('button');
        btn.className = 'caption-more-btn';
        btn.textContent = 'more';
        btn.onclick = function(e) {
          e.stopPropagation();
          el.style.webkitLineClamp = 'unset';
          el.style.overflow = 'visible';
          el.style.display = 'block';
          btn.remove();
        };
        el.parentNode.appendChild(btn);
      }
    });
  }
 
  function showMore() {
    const prevCount = displayCount;
    displayCount += 6;
    const grid = document.getElementById('gallery-grid');
 
    // Remove existing "see more" button
    const oldBtn = grid.querySelector('.see-more-row');
    if (oldBtn) oldBtn.remove();
 
    // Append only the new cards (preserves expanded captions in existing cards)
    const frag = document.createDocumentFragment();
    allPhotos.slice(prevCount, displayCount).forEach((photo, i) => {
      const div = document.createElement('div');
      div.innerHTML = cardHtml(photo, prevCount + i);
      frag.appendChild(div.firstElementChild);
    });
    grid.appendChild(frag);
 
    // Re-add "see more" button if there are more photos
    if (allPhotos.length > displayCount) {
      const row = document.createElement('div');
      row.innerHTML = `<div class="see-more-row"><button class="see-more-btn" onclick="showMore()">See more photos</button></div>`;
      grid.appendChild(row.firstElementChild);
    }
 
    requestAnimationFrame(() => requestAnimationFrame(addCaptionToggles));
  }
 
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
 
  function updateCaptionCount(el) {
    const max = parseInt(el.maxLength, 10);
    const used = [...el.value].length;
    const remaining = max - used;
    const counter = document.getElementById('caption-count');
    if (counter) counter.textContent = remaining;
    if (used > max) {
      el.value = [...el.value].slice(0, max).join('');
    }
  }
 
  // ── CAPTION MODAL ──
 
  function openCaptionModal(input) {
    pendingFiles = [...input.files];
    pendingIndex = 0;
    input.value = '';
    if (!pendingFiles.length) return;
    showModalForFile(pendingIndex);
  }
 
  function showModalForFile(idx) {
    const file = pendingFiles[idx];
    const preview      = document.getElementById('caption-preview');
    const captionInput = document.getElementById('caption-input');
    const authorInput  = document.getElementById('author-input');
 
    const url = URL.createObjectURL(file);
    preview.onload = () => URL.revokeObjectURL(url);
    preview.src = url;
 
    authorInput.value = sessionAuthor;
    captionInput.value = '';
    updateCaptionCount(captionInput);
    document.getElementById('upload-status').textContent =
      pendingFiles.length > 1 ? `Photo ${idx + 1} of ${pendingFiles.length}` : '';
    document.getElementById('caption-upload-btn').disabled = false;
    document.getElementById('caption-upload-btn').textContent =
      pendingFiles.length > 1 && idx < pendingFiles.length - 1 ? 'Next →' : 'Upload';
 
    document.getElementById('caption-modal').classList.add('open');
    (idx === 0 && !sessionAuthor ? authorInput : captionInput).focus();
  }
 
  function cancelUpload() {
    pendingFiles = [];
    pendingIndex = 0;
    uploadInProgress = false;
    document.getElementById('caption-modal').classList.remove('open');
    document.getElementById('upload-status').textContent = '';
  }
 
  async function submitUpload() {
    uploadInProgress = true;
 
    const file    = pendingFiles[pendingIndex];
    const caption = document.getElementById('caption-input').value.trim();
 
    const typedAuthor = document.getElementById('author-input').value.trim();
    const author = typedAuthor || getOrGenerateGuest();
    sessionAuthor = typedAuthor;
    if (typedAuthor) localStorage.setItem('weddingGalleryAuthor', typedAuthor);
    const btn    = document.getElementById('caption-upload-btn');
    const status = document.getElementById('upload-status');
 
    btn.disabled = true;
    btn.textContent = 'Uploading…';
 
    const ext  = file.name.split('.').pop().toLowerCase() || 'jpg';
    const mime = { jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', webp:'image/webp', gif:'image/gif' }[ext] || file.type || 'image/jpeg';
 
    if (ext === 'heic' || ext === 'heif') {
      status.textContent = 'HEIC not supported — please save as JPEG first.';
      document.getElementById('caption-modal').classList.remove('open');
      uploadInProgress = false;
      return;
    }
 
    // Compress image (silently — user just sees "Uploading…")
    let fileToUpload = file;
    if (ext !== 'gif') {
      try {
        fileToUpload = await imageCompression(file, { maxSizeMB: 3, maxWidthOrHeight: 2048, useWebWorker: true, initialQuality: 0.8 });
      } catch (e) {
        console.warn('Compression failed, uploading original:', e);
        fileToUpload = file;
      }
    }
 
    try {
      const presignRes = await fetch(`${PRESIGN_API}?ext=${ext}`);
      if (!presignRes.ok) throw new Error(`Presign failed: ${presignRes.status}`);
      const { url, key: imageKey, captionUrl } = await presignRes.json();
 
      // Track this device's uploads so the banner doesn't fire for the uploader
      myUploadedKeys.add(imageKey);
 
      const s3Res = await fetch(url, { method: 'PUT', body: fileToUpload, headers: { 'Content-Type': mime } });
      if (!s3Res.ok) throw new Error(`S3 upload failed: ${s3Res.status}`);
 
      if (captionUrl) {
        await fetch(captionUrl, {
          method: 'PUT',
          body: JSON.stringify({ author, ...(caption ? { caption } : {}) }),
          headers: { 'Content-Type': 'application/json' },
        });
      }
    } catch (err) {
      console.error('Upload error:', err);
      status.textContent = `Could not upload ${file.name} — please try again.`;
      document.getElementById('caption-modal').classList.remove('open');
      btn.disabled = false;
      uploadInProgress = false;
      return;
    }
 
    document.getElementById('caption-modal').classList.remove('open');
    pendingIndex++;
 
    if (pendingIndex < pendingFiles.length) {
      setTimeout(() => showModalForFile(pendingIndex), 200);
    } else {
      pendingFiles = [];
      pendingIndex = 0;
      status.textContent = 'Photos shared! 🎉';
      setTimeout(async () => {
        status.textContent = '';
        await loadGallery();
        uploadInProgress = false;
      }, 2000);
    }
  }
 
  // ── LIGHTBOX ──
 
  function openLightbox(index) {
    lightboxIndex = index;
    const photo = allPhotos[index];
    document.getElementById('lightbox-img').src = `${S3_BASE}/${photo.key}`;
    document.getElementById('lightbox-caption').innerHTML =
      (photo.author  ? `<strong class="lightbox-author">${escHtml(photo.author)}</strong> ` : '') +
      (photo.caption ? escHtml(photo.caption) : '');
    renderLightboxReactions(photo.reactions, photo.key);
    document.getElementById('gallery-lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
 
  function closeLightbox() {
    document.getElementById('gallery-lightbox').classList.remove('open');
    document.getElementById('lightbox-img').src = '';
    document.getElementById('lightbox-caption').textContent = '';
    document.getElementById('lightbox-reactions').innerHTML = '';
    document.body.style.overflow = '';
  }
 
  function shiftLightbox(dir) {
    if (!allPhotos.length) return;
    lightboxIndex = (lightboxIndex + dir + allPhotos.length) % allPhotos.length;
    const photo = allPhotos[lightboxIndex];
    document.getElementById('lightbox-img').src = `${S3_BASE}/${photo.key}`;
    document.getElementById('lightbox-caption').innerHTML =
      (photo.author  ? `<strong class="lightbox-author">${escHtml(photo.author)}</strong> ` : '') +
      (photo.caption ? escHtml(photo.caption) : '');
    renderLightboxReactions(photo.reactions, photo.key);
  }
 
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowRight') shiftLightbox(1);
    if (e.key === 'ArrowLeft')  shiftLightbox(-1);
  });
 
  const _captionModal = document.getElementById('caption-modal');
  if (_captionModal) {
    _captionModal.addEventListener('click', function(e) {
      if (e.target === this) cancelUpload();
    });
  }
 
  loadGallery();
  setInterval(silentRefresh, 10000);
</script>
</body>
</html>
